name: Bug report
description: Something in 8cli does not work as documented.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Security problem?** Do not use this form. Report it privately – see [SECURITY.md](https://github.com/qodeca/8cli/blob/main/SECURITY.md).

        Please remove tokens, keys and private paths from anything you paste below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw. Paste error text as text, not as a screenshot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: The smallest set of steps that shows the problem, the exact commands you ran and what they printed.
      placeholder: |
        1. 8cli --url https://n8n.example.com wf list
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 8cli version
      description: The output of `8cli --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.5, Ubuntu 24.04, Windows 11 + WSL2, ...
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: The output of `node --version`.
    validations:
      required: true
  - type: input
    id: n8n
    attributes:
      label: n8n version
      description: The version of the n8n instance you targeted, if known.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: The --verbose output with secrets removed, or when the problem started.
    validations:
      required: false
